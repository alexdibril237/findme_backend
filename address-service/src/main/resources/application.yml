







server:
  port: 8082

spring:
  application:
    name: address-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:address_db}
    username: ${DB_USER:address_user}
    password: ${DB_PASSWORD:address_pass}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

jwt:
  secret: ${JWT_SECRET:change-me-in-production-change-me-in-production}

storage:
  root: ${STORAGE_ROOT:/data/photos}
  public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:8080/files}
  allowed-content-types: image/jpeg,image/png,image/webp
  max-file-size-bytes: 5242880

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.geolink.findme: INFO