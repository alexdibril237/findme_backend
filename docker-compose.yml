services:

  findme-db:
    image: postgres:16
    environment:
      POSTGRES_DB: findme_db
      POSTGRES_USER: findme_user
      POSTGRES_PASSWORD: findme_pass
    volumes:
      - findme_db_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U findme_user -d findme_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  findme-app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      findme-db:
        condition: service_healthy
    environment:
      DB_HOST: findme-db
      DB_PORT: 5432
      DB_NAME: findme_db
      DB_USER: findme_user
      DB_PASSWORD: findme_pass
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      STORAGE_ROOT: /data/photos
      STORAGE_PUBLIC_BASE_URL: http://localhost:8080/files
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    volumes:
      - findme_photos:/data/photos
    ports:
      - '8080:8080'
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  findme_db_data:
  findme_photos:
