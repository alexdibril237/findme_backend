server:
  port: 8083

spring:
  application:
    name: admin-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:admin_db}
    username: ${DB_USER:admin_user}
    password: ${DB_PASSWORD:admin_pass}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:change-me-in-production-change-me-in-production}

clients:
  auth-service:
    base-url: ${AUTH_SERVICE_URL:http://localhost:8081}
    timeout-ms: 3000
  address-service:
    base-url: ${ADDRESS_SERVICE_URL:http://localhost:8082}
    timeout-ms: 3000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.geolink.findme: INFO