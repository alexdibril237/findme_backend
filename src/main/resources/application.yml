server:
  port: 8080

spring:
  application:
    name: findme-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:findme_db}
    username: ${DB_USER:findme_user}
    password: ${DB_PASSWORD:findme_pass}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

jwt:
  secret: ${JWT_SECRET:change-me-in-production-change-me-in-production}
  access-token-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
  refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}
  reset-token-ttl-minutes: ${JWT_RESET_TTL_MINUTES:30}

storage:
  root: ${STORAGE_ROOT:/data/photos}
  public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:8080/files}
  allowed-content-types: image/jpeg,image/png,image/webp
  max-file-size-bytes: 5242880

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

resend:
  api-key: ${RESEND_API_KEY:}
  from: ${RESEND_FROM:findMe <onboarding@resend.dev>}

management:
  endpoints:
    web:
      exposure:
        # 'prometheus' est scrapé par le conteneur Prometheus sur le réseau Docker interne
        # (infra/), jamais exposé sans restriction en production (voir docs/sla).
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.geolink.findme: INFO
