name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code (historique complet pour Gitleaks)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-test:
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v7

      - name: Installation de Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build (compile)
        run: ./mvnw -B compile

      - name: Tests unitaires
        run: ./mvnw -B test

      - name: Tests d'intégration (Testcontainers) + Quality Gate JaCoCo
        run: ./mvnw -B verify

      - name: Upload du rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 14

  container-scan:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Récupération du code
        uses: actions/checkout@v7

      - name: Build de l'image Docker
        run: docker build -t findme-backend:${{ github.sha }} .

      - name: Scan Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: findme-backend:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Upload des résultats vers l'onglet Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif